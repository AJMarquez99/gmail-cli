# One-time manual setup required before this workflow will publish:
#
#   1. Claim the @ajmarquez99 npm scope (if not already owned) and ensure the
#      package name @ajmarquez99/gmail-cli is available on npmjs.com.
#
#   2. Generate an npm Automation token (npmjs.com → Access Tokens → Generate
#      New Token → Automation) and add it as a repository secret named
#      NPM_TOKEN (GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret).
#
#   3. Push a version tag matching the pattern vX.Y.Z (e.g. v0.3.0) whose
#      version matches the "version" field in package.json to trigger publish:
#        git tag v0.3.0
#        git push origin v0.3.0

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run test:run
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
